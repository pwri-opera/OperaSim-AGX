<!DOCTYPE HTML>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>PWRI OperaSim-AGX Streaming Receiver</title>
</head>

<body>

  <div id="container">
    <h1>PWRI OperaSim-AGX Streaming Receiver</h1>

    <div id="warning" hidden="true"></div>

    <div id="playerGrid"></div>

    <fieldset class="box" id="cameraCheckboxes">
      <legend>Cameras</legend>
      <label><input type="checkbox" class="cameraCheckbox" value="0" data-label="GamingUI" checked autocomplete="off" />GamingUI</label>
      <label><input type="checkbox" class="cameraCheckbox" value="1" data-label="Camera1" autocomplete="off" />Camera1</label>
      <label><input type="checkbox" class="cameraCheckbox" value="2" data-label="Camera2" autocomplete="off" />Camera2</label>
      <label><input type="checkbox" class="cameraCheckbox" value="3" data-label="Camera3" autocomplete="off" />Camera3</label>
    </fieldset>

    <p>
      Check one or more cameras to stream them into the grid above. Cameras can be added or removed at any time after the initial play.
    </p>

    <div id="message"></div>

    <section>
      <a href="https://github.com/Unity-Technologies/UnityRenderStreaming/tree/main/WebApp/client/public/receiver"
        title="View source for this page on GitHub" id="viewSource">View source on GitHub</a>
    </section>
  </div>

  <script type="text/javascript" src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="https://unpkg.com/event-target@latest/min.js"></script>
  <script src="https://unpkg.com/resize-observer-polyfill@1.5.0/dist/ResizeObserver.global.js"></script>
  <script type="module" src="js/main.js"></script>

</body>

</html>
